services:
  web:
    image: rsyslog-manager-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped

  proxy:
    image: caddy:latest
    ports:
      - "8090:8080"
      - "8453:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
